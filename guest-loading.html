<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="guestRedirect" http-equiv="refresh" content="2;url=index.html">
  <title>Signing you in · Student Expense Tracker</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="bg-scene" aria-hidden="true">
    <span class="blob blob-emerald"></span>
    <span class="blob blob-indigo"></span>
    <span class="blob blob-purple"></span>
    <div class="grain"></div>
  </div>

  <main class="login-wrapper">
    <section class="login-card fade-in loading-card">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" id="guestStatus" role="status">Setting up your guest session&hellip;</p>
      <a class="btn btn-ghost" id="guestReturn" href="login.html" hidden>Back to sign in</a>
    </section>
  </main>

  <script>
    (function () {
      const guestResult = Auth.loginAsGuest();
      if (!guestResult.ok) {
        document.getElementById("guestRedirect").remove();
        const status = document.getElementById("guestStatus");
        status.setAttribute("role", "alert");
        status.textContent = guestResult.message;
        document.getElementById("guestReturn").hidden = false;
      }
    })();
  </script>

</body>
</html>
